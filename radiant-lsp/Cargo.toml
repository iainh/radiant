[package]
name = "radiant-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Language server for Radiant templates"

[dependencies]
radiant-compiler = { path = "../radiant-compiler" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"

[dev-dependencies]
serde_json = "1"
